<!DOCTYPE html>
<html>
<head>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/Flip.min.js"></script>
    <link rel="stylesheet" href="demo/demo.css">
    <script src="src/gia.js"></script>
    <script src="examples/FilterableListGSAP.js"></script>
</head>
<body>
    <div data-component="FilterableListGSAP" data-options='{"defaultSort": "name:asc"}'>
      <div class="controls">
        <button data-ref="filter" data-filter-type="shape" data-filter-value="circle">Circle</button>
        <button data-ref="filter" data-filter-type="shape" data-filter-value="square">Square</button>
      </div>
      <div data-ref="container" class="grid">
        <div class="item" data-ref="item" data-shape="circle"><div class="shape-visual" data-shape="circle"></div>Circle 1</div>
        <div class="item" data-ref="item" data-shape="square"><div class="shape-visual" data-shape="square"></div>Square 1</div>
        <div class="item" data-ref="item" data-shape="circle"><div class="shape-visual" data-shape="circle"></div>Circle 2</div>
      </div>
    </div>
    <script>
        gia.loadComponents();
    </script>
</body>
</html>

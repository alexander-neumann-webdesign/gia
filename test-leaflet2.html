<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  #map { height: 400px; width: 100%; }

  .leaflet-control-attribution {
    background: rgba(255, 255, 255, 0.8) !important;
    border-radius: 20px;
    padding: 0 !important;
    display: flex;
    align-items: center;
    transition: all 0.3s ease;
    overflow: hidden;
    cursor: pointer;
  }

  .leaflet-control-attribution.osm-compact {
    width: 26px;
    height: 26px;
    white-space: nowrap;
    justify-content: center;
  }

  .leaflet-control-attribution.osm-compact::before {
    content: "i";
    font-family: serif;
    font-style: italic;
    font-weight: bold;
    font-size: 16px;
    color: #333;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
  }

  .leaflet-control-attribution.osm-compact > * {
    display: none;
  }

  .leaflet-control-attribution.osm-expanded {
    padding: 2px 8px !important;
    width: auto;
    height: auto;
  }

  .leaflet-control-attribution.osm-expanded::before {
    display: none;
  }
</style>
</head>
<body>
  <div id="map"></div>
  <script>
    var map = L.map('map', { attributionControl: false }).setView([51.505, -0.09], 13);

    var attrControl = L.control.attribution({ prefix: false });
    attrControl.addTo(map);

    var container = attrControl.getContainer();
    container.classList.add('osm-compact');

    container.addEventListener('click', function(e) {
      if (container.classList.contains('osm-compact')) {
        container.classList.remove('osm-compact');
        container.classList.add('osm-expanded');
      } else {
        container.classList.add('osm-compact');
        container.classList.remove('osm-expanded');
      }
      e.stopPropagation();
    });

    map.on('click', function() {
      if (container.classList.contains('osm-expanded')) {
        container.classList.add('osm-compact');
        container.classList.remove('osm-expanded');
      }
    });

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
  </script>
</body>
</html>

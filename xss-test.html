<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<div data-component="HelloWorld" data-options='{"__proto__": {"polluted": true}}'></div>
	<script src="dist/gia.umd.js"></script>
	<script>
		class HelloWorld extends gia.Component {
			mount() {
				console.log("Hello world!", this.options);
				this.element.innerHTML = "Hello world!";
			}
		}
	</script>
	<script>
		gia.config.set('log', true);
		gia.config.set('attrPrefix', 'data');

		gia.loadComponents({
			"HelloWorld": HelloWorld
		});

		console.log("Is polluted?", {}.polluted);
	</script>
</body>
</html>

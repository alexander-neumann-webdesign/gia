<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImageComparison - Gia Components Demo</title>
  
  <!-- Add any necessary vendor scripts here based on component if needed from demo/index.html -->
  <script id="gsap" data-src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script id="fitty-js" data-src="https://unpkg.com/fitty@2.4.2/dist/fitty.min.js"></script>
  <link rel="stylesheet" href="../demo.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
    }
    .demo-block {
      margin-top: 1rem;
      border: 1px dashed #aaa;
      padding: 1rem;
      border-radius: 8px;
    }
    .options-pre {
      background: #f4f4f4;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
    }
    nav {
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">&larr; Back to all components</a>
  </nav>
  
  <h1>ImageComparison</h1>
  <p>Demo showcasing all configuration options for <strong>ImageComparison</strong>.</p>
  
  <h2>Available Options</h2>
  <pre class="options-pre"><code>No default options found.</code></pre>
  
  <section id="ImageComparison">
    <h2>Interactive Demo</h2>
    <div class="container">
      <h2>Image Comparison</h2>
      <div class="demo-block">
        <div class="image-comparison" data-component="ImageComparison" style="--exposure: 50%;">
          <!-- Left/Before side -->
          <div class="image-comparison__before">
            <img src="sample-image.jpg" alt="Before" style="filter: grayscale(100%);" />
          </div>
          <!-- Right/After side -->
          <div class="image-comparison__after">
            <img src="sample-image.jpg" alt="After" />
          </div>

          <input type="range" class="image-comparison__slider" min="0" max="100" step="any" value="50"
            aria-label="Image comparison slider" data-ref="slider" />

          <div class="image-comparison__handle" aria-hidden="true" data-ref="handle">
            <div class="image-comparison__handle-line"></div>
            <div class="image-comparison__handle-button"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Core library -->
  <script src="../../dist/gia.full.umd.js"></script>
  
  <!-- Component script -->
  <script src="../../examples/ImageComparison.js"></script>

  <!-- Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.gia && window.gia.components) {
            gia.loadComponents(window.gia.components);
        }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ImageHolder - Gia Components Demo</title>
  
  <!-- Add any necessary vendor scripts here based on component if needed from demo/index.html -->
  <script id="gsap" data-src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script id="fitty-js" data-src="https://unpkg.com/fitty@2.4.2/dist/fitty.min.js"></script>
  <link rel="stylesheet" href="../demo.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
    }
    .demo-block {
      margin-top: 1rem;
      border: 1px dashed #aaa;
      padding: 1rem;
      border-radius: 8px;
    }
    .options-pre {
      background: #f4f4f4;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
    }
    nav {
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">&larr; Back to all components</a>
  </nav>
  
  <h1>ImageHolder</h1>
  <p>Demo showcasing all configuration options for <strong>ImageHolder</strong>.</p>
  
  <h2>Available Options</h2>
  <pre class="options-pre"><code>{
			parallaxSpeed: 0.3,
			parallaxDirection: "vertical",
			parallaxCssVar: false,
			startFromTop: false,
		}</code></pre>
  
  <section id="ImageHolder">
    <h2>Interactive Demo</h2>
    <h2>ImageHolder</h2>
    <div class="demo-block">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
        <div data-component="ImageHolder" data-options='{"parallaxSpeed": 0}' style="aspect-ratio: 4 / 3;">
          <img data-ref="img" src="sample-image.jpg" sizes="100vw" alt="No parallax" loading="lazy" />
        </div>
        <div data-component="ImageHolder" data-options='{"parallaxSpeed": 0.2}' style="aspect-ratio: 4 / 3;">
          <img data-ref="img" src="sample-image.jpg" sizes="100vw" alt="0.2 parallax" loading="lazy" />
        </div>
        <div data-component="ImageHolder" data-options='{"parallaxSpeed": 0.4}' style="aspect-ratio: 4 / 3;">
          <img data-ref="img" src="sample-image.jpg" sizes="100vw" alt="0.4 parallax" loading="lazy" />
        </div>
      </div>
    </div>
  </section>

  <!-- Core library -->
  <script src="../../dist/gia.full.umd.js"></script>
  
  <!-- Component script -->
  <script src="../../examples/ImageHolder.js"></script>

  <!-- Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.gia && window.gia.components) {
            gia.loadComponents(window.gia.components);
        }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TextFit - Gia Components Demo</title>
  
  <!-- Component Dependencies -->
  <script id="fitty-js" data-src="https://unpkg.com/fitty@2.4.2/dist/fitty.min.js"></script>
  <link rel="stylesheet" href="../assets/css/demo.css">
  
</head>
<body>
<main class="demo-container">
  <nav>
    <a href="../index.html">&larr; Back to all components</a>
  </nav>
  
  <h1>TextFit</h1>
  <p>Demo showcasing all configuration options for <strong>TextFit</strong>.</p>
  
  <h2>Available Options</h2>
  <pre class="options-pre"><code>{
	minSize: 16,
	maxSize: 512,
	multiLine: true,
	...this.options
}</code></pre>
  
  <section id="TextFit">
    <h2>Interactive Demo</h2>
    <h2>TextFit</h2>
    <div class="demo-block"
      style="width: 50%; border: 1px solid #ccc; padding: 10px; resize: horizontal; overflow: hidden; max-width: 100%;">
      <div style="width: 100%;">
        <div data-component="TextFit" data-options='{"minSize": 10, "maxSize": 100, "multiLine": false}'
          style="display: inline-block; white-space: nowrap;">
          Resize this container to see text scaling
        </div>
      </div>
    </div>
  </section>

  <!-- Core library -->
  <script src="../../dist/gia.full.umd.js"></script>
  
  <!-- Component scripts -->
  <script src="../../examples/TextFit.js"></script>

  <!-- Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.gia && window.gia.components) {
            gia.loadComponents(window.gia.components);
        }
    });
  </script>
</main>
</body>
</html>

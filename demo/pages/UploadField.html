<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UploadField - Gia Components Demo</title>
  
  <!-- Component Dependencies -->
  <link rel="stylesheet" href="../assets/css/demo.css">
  
</head>
<body>
<main class="demo-container">
  <nav>
    <a href="../index.html">&larr; Back to all components</a>
  </nav>
  
  <h1>UploadField</h1>
  <p>Demo showcasing all configuration options for <strong>UploadField</strong>.</p>
  
  <h2>Available Options</h2>
  <pre class="options-pre"><code>{
	addMoreFilesText: '+ Add more files',
	removeFileText: '🗑️',
}</code></pre>
  
  <section id="UploadField">
    <h2>Interactive Demo</h2>
    <div class="demo-block">
      <div data-component="UploadField" class="form-dropzone" >
           <input type="file" id="file-upload" name="files[]" multiple  />
           <label for="file-upload" class="form-dropzone-label">Drag and drop files here or click to browse</label>
         </div>
    </div>
  </section>

  <!-- Core library -->
  <script src="../../dist/gia.full.umd.js"></script>
  
  <!-- Component scripts -->
  <script src="../../examples/UploadField.js"></script>

  <!-- Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.gia && window.gia.components) {
            gia.loadComponents(window.gia.components);
        }
    });
  </script>
</main>
</body>
</html>

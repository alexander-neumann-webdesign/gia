<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tooltip - Gia Components Demo</title>
  
  <!-- Component Dependencies -->
  <script id="floating-ui-js" data-src="https://cdn.jsdelivr.net/npm/@floating-ui/core@1.6.0"></script>
  <script id="floating-ui-dom-js" data-src="https://cdn.jsdelivr.net/npm/@floating-ui/dom@1.6.3"></script>
  <link rel="stylesheet" href="../assets/css/demo.css">
  
</head>
<body>
<main class="demo-container">
  <nav>
    <a href="../index.html">&larr; Back to all components</a>
  </nav>
  
  <h1>Tooltip</h1>
  <p>Demo showcasing all configuration options for <strong>Tooltip</strong>.</p>
  
  <h2>Available Options</h2>
  <pre class="options-pre"><code>No default options found.</code></pre>
  
  <section id="Tooltip">
    <h2>Interactive Demo</h2>
    <h2>Tooltip</h2>
    <div class="demo-block">
      <!-- Required External Script: -->
      <!-- <script id="floating-ui-js" data-src="vendor/floating-ui.umd.js"></script> -->

      <div style="display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; padding: 2rem;">
        <button data-component="Tooltip" data-tooltip="Tooltip on Top" data-position="top">
          Top
        </button>
        <button data-component="Tooltip" data-tooltip="Tooltip on Right" data-position="right">
          Right
        </button>
        <button data-component="Tooltip" data-tooltip="Tooltip on Bottom" data-position="bottom">
          Bottom
        </button>
        <button data-component="Tooltip" data-tooltip="Tooltip on Left" data-position="left">
          Left
        </button>
      </div>


    </div>
  </section>

  <!-- Core library -->
  <script src="../../dist/gia.full.umd.js"></script>
  
  <!-- Component scripts -->
  <script src="../../examples/Tooltip.js"></script>

  <!-- Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.gia && window.gia.components) {
            gia.loadComponents(window.gia.components);
        }
    });
  </script>
</main>
</body>
</html>

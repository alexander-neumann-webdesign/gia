<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoHolder - Gia Components Demo</title>
  
  <!-- Add any necessary vendor scripts here based on component if needed from demo/index.html -->
  <script id="gsap" data-src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script id="fitty-js" data-src="https://unpkg.com/fitty@2.4.2/dist/fitty.min.js"></script>
  <link rel="stylesheet" href="../demo.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
    }
    .demo-block {
      margin-top: 1rem;
      border: 1px dashed #aaa;
      padding: 1rem;
      border-radius: 8px;
    }
    .options-pre {
      background: #f4f4f4;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
    }
    nav {
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">&larr; Back to all components</a>
  </nav>
  
  <h1>VideoHolder</h1>
  <p>Demo showcasing all configuration options for <strong>VideoHolder</strong>.</p>
  
  <h2>Available Options</h2>
  <pre class="options-pre"><code>{
			playOnHover: false,
		}</code></pre>
  
  <section id="VideoHolder">
    <h2>Interactive Demo</h2>
    <h2>VideoHolder</h2>
    <div class="demo-block">
      <div data-component="VideoHolder" tabindex="0" role="region" aria-label="Video player">
        <video data-ref="video" src="sample-video.mp4" loop muted playsinline preload="metadata"></video>
        <div class="video-controls">
          <button data-ref="playPauseButton" aria-label="Play video" class="is-paused">
            <!-- Icons injected via JS -->
          </button>
          <button data-ref="muteButton" aria-label="Unmute video" class="is-muted">
            <!-- Icons injected via JS -->
          </button>
        </div>
      </div>


    </div>
  </section>

  <!-- Core library -->
  <script src="../../dist/gia.full.umd.js"></script>
  
  <!-- Component script -->
  <script src="../../examples/VideoHolder.js"></script>

  <!-- Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.gia && window.gia.components) {
            gia.loadComponents(window.gia.components);
        }
    });
  </script>
</body>
</html>

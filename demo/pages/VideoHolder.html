<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoHolder - Gia Components Demo</title>
  
  <!-- Component Dependencies -->
  <link rel="stylesheet" href="../assets/css/demo.css">
  
</head>
<body>
<main class="demo-container">
  <nav>
    <a href="../index.html">&larr; Back to all components</a>
  </nav>
  
  <h1>VideoHolder</h1>
  <p>Demo showcasing all configuration options for <strong>VideoHolder</strong>.</p>
  
  <h2>Available Options</h2>
  <pre class="options-pre"><code>{
	playOnHover: false,
}</code></pre>
  
  <section id="VideoHolder">
    <h2>Interactive Demo</h2>
    <h2>VideoHolder</h2>
    <div class="demo-block">
      <div data-component="VideoHolder" tabindex="0" role="region" aria-label="Video player">
        <video data-ref="video" src="../assets/video/sample-video.mp4" loop muted playsinline preload="metadata">
          <track kind="subtitles" srclang="en" label="English" src="../assets/video/sample-subtitles.vtt">
        </video>
        <div class="video-controls">
          <button type="button" data-ref="playPauseButton" aria-label="Play or pause video" aria-pressed="false" class="is-paused">
            <!-- Icons injected via JS -->
          </button>
          <button type="button" data-ref="subtitleButton" aria-label="Toggle subtitles" aria-pressed="false" class="is-disabled">
            <!-- Icons injected via JS -->
          </button>
          <div class="mute-container">
            <div class="volume-slider-wrapper">
              <input type="range" data-ref="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" aria-label="Volume">
            </div>
            <button type="button" data-ref="muteButton" aria-label="Mute or unmute video" aria-pressed="true" class="is-muted">
              <!-- Icons injected via JS -->
            </button>
          </div>
        </div>
        <div class="timeline-container">
          <input type="range" data-ref="timelineSlider" class="timeline-slider" min="0" max="0" step="0.01" value="0" aria-label="Video timeline">
        </div>
      </div>


    </div>
  </section>

  <!-- Core library -->
  <script src="../../dist/gia.full.umd.js"></script>
  
  <!-- Component scripts -->
  <script src="../../examples/VideoHolder.js"></script>

  <!-- Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.gia && window.gia.components) {
            gia.loadComponents(window.gia.components);
        }
    });
  </script>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OffCanvasMenu - Gia Components Demo</title>
  
  <!-- Component Dependencies -->
  <link rel="stylesheet" href="../assets/css/demo.css">
  
</head>
<body>
<main class="demo-container">
  <nav>
    <a href="../index.html">&larr; Back to all components</a>
  </nav>
  
  <h1>OffCanvasMenu</h1>
  <p>Demo showcasing all configuration options for <strong>OffCanvasMenu</strong>.</p>
  
  <h2>Available Options</h2>
  <pre class="options-pre"><code>{
	preventScroll: true,
	mainContentSelector: "main",
	updateLocationHash: false,
}</code></pre>
  
  <section id="OffCanvasMenu">
    <h2>Interactive Demo</h2>
    <h2>OffCanvasMenu</h2>
    <div class="demo-block">
      <!-- Trigger inside Header, e.g., a burger button -->
      <header>
        <button data-offcanvas-target="main-menu" aria-label="Open menu">☰</button>
      </header>

      <div data-component="OffCanvasMenu" id="main-menu" role="dialog" aria-modal="true" aria-label="Main Navigation"
        aria-hidden="true">
        <div class="offcanvas-content">
          <button data-action="click->handleCloseClick" data-offcanvas-close aria-label="Close menu">✕</button>
          <nav>
            <ul>
              <li><a href="/">Home</a></li>
              <li><a href="/about">About</a></li>
            </ul>
          </nav>
        </div>
      </div>


    </div>
  </section>

  <!-- Core library -->
  <script src="../../dist/gia.full.umd.js"></script>
  
  <!-- Component scripts -->
  <script src="../../examples/OffCanvasMenu.js"></script>

  <!-- Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.gia && window.gia.components) {
            gia.loadComponents(window.gia.components);
        }
    });
  </script>
</main>
</body>
</html>

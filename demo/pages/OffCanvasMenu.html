<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OffCanvasMenu - Gia Components Demo</title>
  
  <!-- Add any necessary vendor scripts here based on component if needed from demo/index.html -->
  <script id="gsap" data-src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script id="fitty-js" data-src="https://unpkg.com/fitty@2.4.2/dist/fitty.min.js"></script>
  <link rel="stylesheet" href="../demo.css">
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
    }
    .demo-block {
      margin-top: 1rem;
      border: 1px dashed #aaa;
      padding: 1rem;
      border-radius: 8px;
    }
    .options-pre {
      background: #f4f4f4;
      padding: 1rem;
      border-radius: 4px;
      overflow-x: auto;
    }
    nav {
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <nav>
    <a href="index.html">&larr; Back to all components</a>
  </nav>
  
  <h1>OffCanvasMenu</h1>
  <p>Demo showcasing all configuration options for <strong>OffCanvasMenu</strong>.</p>
  
  <h2>Available Options</h2>
  <pre class="options-pre"><code>{
			preventScroll: true,
			mainContentSelector: "main",
			updateLocationHash: false,
		}</code></pre>
  
  <section id="OffCanvasMenu">
    <h2>Interactive Demo</h2>
    <h2>OffCanvasMenu</h2>
    <div class="demo-block">
      <!-- Trigger inside Header, e.g., a burger button -->
      <header>
        <button data-offcanvas-target="main-menu" aria-label="Open menu">☰</button>
      </header>

      <div data-component="OffCanvasMenu" id="main-menu" role="dialog" aria-modal="true" aria-label="Main Navigation"
        aria-hidden="true">
        <div class="offcanvas-content">
          <button data-action="click->handleCloseClick" data-offcanvas-close aria-label="Close menu">✕</button>
          <nav>
            <ul>
              <li><a href="/">Home</a></li>
              <li><a href="/about">About</a></li>
            </ul>
          </nav>
        </div>
      </div>


    </div>
  </section>

  <!-- Core library -->
  <script src="../../dist/gia.full.umd.js"></script>
  
  <!-- Component script -->
  <script src="../../examples/OffCanvasMenu.js"></script>

  <!-- Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.gia && window.gia.components) {
            gia.loadComponents(window.gia.components);
        }
    });
  </script>
</body>
</html>

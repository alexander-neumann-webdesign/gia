<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modal - Gia Components Demo</title>
  
  <!-- Component Dependencies -->
  <link rel="stylesheet" href="../assets/css/demo.css">
  
</head>
<body>
<main class="demo-container">
  <nav>
    <a href="../index.html">&larr; Back to all components</a>
  </nav>
  
  <h1>Modal</h1>
  <p>Demo showcasing all configuration options for <strong>Modal</strong>.</p>
  
  <h2>Available Options</h2>
  <pre class="options-pre"><code>{
	preventScroll: true
}</code></pre>
  
  <section id="Modal">
    <h2>Interactive Demo</h2>
    <h2>Modal</h2>
    <div class="demo-block">
      <!-- Triggers can be anywhere -->
      <button data-modal-target="my-modal">Open Modal</button>

      <!-- The modal itself -->
      <dialog data-component="Modal" id="my-modal">
        <div class="modal-content">
          <h2>Modal Title</h2>
          <button data-ref="closeButton">Close</button>
        </div>
      </dialog>


    </div>
  </section>

  <!-- Core library -->
  <script src="../../dist/gia.full.umd.js"></script>
  
  <!-- Component scripts -->
  <script src="../../examples/Modal.js"></script>

  <!-- Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.gia && window.gia.components) {
            gia.loadComponents(window.gia.components);
        }
    });
  </script>
</main>
</body>
</html>

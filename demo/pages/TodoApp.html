<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TodoApp - Gia Components Demo</title>
  
  <!-- Component Dependencies -->
  <link rel="stylesheet" href="../assets/css/demo.css">
  
</head>
<body>
<main class="demo-container">
  <nav>
    <a href="../index.html">&larr; Back to all components</a>
  </nav>
  
  <h1>TodoApp</h1>
  <p>Demo showcasing all configuration options for <strong>TodoApp</strong>.</p>
  
  <h2>Available Options</h2>
  <pre class="options-pre"><code>{
	storageKey: "gia-todo-app-data",
	deleteText: "Delete",
}</code></pre>
  
  <section id="TodoApp">
    <h2>Interactive Demo</h2>
    <h2>TodoApp</h2>
    <div class="demo-block">
      <!-- Note: Ensure `gia.config.set('autoBindActions', true);` is called to enable `data-action` binding. -->
      <div data-component="TodoApp" class="todo-app">
        <!-- Screen reader announcer for accessibility -->
        <div class="sr-only" aria-live="polite" data-ref="announcer"></div>

        <form data-action="submit->handleFormSubmit" class="todo-form">
          <label for="new-todo" class="sr-only">Add new task</label>
          <input type="text" id="new-todo" data-ref="input" placeholder="What needs to be done?" class="todo-input"
            required />
          <button type="submit" class="todo-submit-btn">Add Task</button>
        </form>

        <ul data-ref="list" class="todo-list" aria-label="Task list">
          <!-- Tasks will be rendered here dynamically -->
        </ul>
      </div>


    </div>
  </section>

  <!-- Core library -->
  <script src="../../dist/gia.full.umd.js"></script>
  
  <!-- Component scripts -->
  <script src="../../examples/TodoApp.js"></script>

  <!-- Initialization -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.gia && window.gia.components) {
            gia.loadComponents(window.gia.components);
        }
    });
  </script>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Test OSM Attribution</title>
  <link id="leaflet-css" rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script id="leaflet-js" src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    #map { width: 100%; height: 400px; }

    /* Override leaflet default background and padding so our details can manage it */
    .leaflet-control-attribution.leaflet-control {
      background: none;
      padding: 0;
      margin: 0;
    }

    .osm-attribution-details {
      background: rgba(255, 255, 255, 0.8);
      border-radius: 4px;
      padding: 0;
      margin: 0;
      display: flex;
      align-items: center;
    }

    .osm-attribution-details[open] {
      padding: 0 5px;
    }

    .osm-attribution-summary {
      list-style: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 4px;
    }

    /* hide the default summary arrow */
    .osm-attribution-summary::-webkit-details-marker {
      display: none;
    }

    .osm-attribution-text {
      margin-left: 4px;
      display: none;
    }

    .osm-attribution-details[open] .osm-attribution-text {
      display: inline;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    const map = L.map('map').setView([51.505, -0.09], 13);
    map.attributionControl.setPrefix(false);

    const attributionHTML = `
      <details class="osm-attribution-details">
        <summary class="osm-attribution-summary" title="Attribution">
          <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
        </summary>
        <span class="osm-attribution-text">&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors</span>
      </details>
    `;

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: attributionHTML
    }).addTo(map);
  </script>
</body>
</html>
